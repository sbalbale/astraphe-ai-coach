name: Build, Test, and Deploy
# CI nudge: PR #29's squash-merge to main (689c2f4) never triggered a push
# run — no webhook delivery, not a config issue. This comment-only touch
# to a watched path forces a fresh push event to re-run the pipeline,
# specifically to confirm the migrate job's fix actually works.
# Same again for #37's squash-merge (c5b63e0), which also never got a push run.

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'supabase/**'
      - 'mcp-server/**'
      - 'photon-bridge/**'
      - '.github/workflows/deploy.yml'
  # No `paths` filter here, deliberately: backend/mobile/build are required
  # status checks (branch protection on main), and a required check whose
  # workflow never triggers for a given PR (e.g. one that only touches
  # docs/) leaves that check permanently "Expected — waiting", blocking the
  # merge forever. Run unconditionally on every PR into main instead — see
  # the `build` job's `push: false` below for why that's still cheap/safe.
  pull_request:
    branches:
      - main

# Least privilege: only the image-build jobs get packages: write (below). pull_request
# runs execute PR code (pnpm install, pytest), so they shouldn't hold a token that can
# push images to GHCR.
permissions:
  contents: read

jobs:
  # backend, mobile, and build are independent of each other (build doesn't
  # need test results to know whether the image compiles, and vice versa)
  # so they run in parallel — deploy then requires all three via `needs:`,
  # giving the same "never deploy on a broken build or failing tests"
  # guarantee as running them serially, in a third of the wall-clock time.
  # This used to be enforced only by branch-protection policy (required
  # status checks before a PR could merge) — real, but a policy gate, not a
  # pipeline one: it does nothing for a direct push bypassing protection
  # (repo admins can — see enforce_admins), and reading this file alone
  # wouldn't tell you tests were even a precondition for deploy. `needs:`
  # makes it true unconditionally, however main's HEAD got there.
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests with coverage gate (80%)
        # app/config.py's Settings already default SUPABASE_URL/SUPABASE_KEY/
        # GEMINI_API_KEY to test placeholders, and the unit suite mocks every
        # external call — no secrets or env vars needed here.
        run: python -m pytest --cov=app --cov-report=term-missing

  mcp-server:
    # Imports app.dependencies / app.services.coach_tools directly from backend/app
    # (see docs/MCP_SERVER.md's reuse strategy) — install both requirements files.
    # Fully hermetic, same as `backend`: no Supabase instance or secrets needed, see
    # mcp-server/tests/conftest.py.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            mcp-server/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r mcp-server/requirements.txt

      - name: Run mcp-server tests with coverage gate (80%)
        run: python -m pytest --cov=astraphe_mcp --cov-report=term-missing --cov-fail-under=80
        working-directory: mcp-server

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.32.1  # pinned; bump deliberately (matches local dev)

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Pinned with pnpm above. (Node 20 once broke when an unpinned pnpm
          # "latest" started requiring Node >=22.13.)
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: mobile

      - name: Run mobile tests with coverage gate (80%/75% branches)
        run: pnpm test:coverage
        working-directory: mobile

  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Skipped for pull_request: nothing is published in that case (see
      # push: below), so registry credentials aren't needed — and PRs from
      # forks only get a read-only GITHUB_TOKEN with no secrets access
      # anyway, which would make this step fail outright rather than just
      # be a no-op.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on merge to main)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          # A PR build only has to prove the image compiles — it must never
          # publish over :latest with unmerged code. Only an actual push to
          # main (post-merge) publishes.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sbalbale/astraphe-api:latest
            ghcr.io/sbalbale/astraphe-api:${{ github.sha }}

  build-mcp:
    permissions:
      contents: read
      packages: write
    # Independent of `build` (astraphe-api) and of the `mcp-server` test job — same
    # "build doesn't wait on tests, deploy does" split as `build`/`backend`/`deploy`
    # above. `deploy-mcp` below is what actually requires `mcp-server` to have passed.
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on merge to main)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          # Build context is the repo root, not mcp-server/ — the image needs both
          # backend/app and mcp-server/astraphe_mcp (see mcp-server/Dockerfile).
          context: .
          file: mcp-server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sbalbale/astraphe-mcp:latest
            ghcr.io/sbalbale/astraphe-mcp:${{ github.sha }}

  deploy:
    # `migrate` runs first so new backend code never goes live against a schema
    # that doesn't have its columns yet (e.g. a select/upsert of a new column
    # would fail until the migration landed). If a migration fails, deploy is
    # skipped. Consequence: migrations must stay backward-compatible with the
    # previous release (additive: ADD COLUMN IF NOT EXISTS, not DROP/RENAME in
    # the same change as the code that stops using them).
    needs: [build, backend, mobile, migrate]
    # Never on pull_request — this ships to production. Only a real push to
    # main (post-merge), with backend+mobile+build all having succeeded,
    # deploys.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cloudflared
        run: |
          # Fixed version + checksum (not 'latest'): this binary carries the deploy credentials.
          CLOUDFLARED_VERSION=2026.10.7
          CLOUDFLARED_SHA256=1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o cloudflared
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Verify CF credentials are set
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID secret is not set or is empty"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET secret is not set or is empty"
            exit 1
          fi
          echo "CF credentials present (ID length: ${#CF_ACCESS_CLIENT_ID})"

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          # Pinned host keys (see .github/ssh_known_hosts); never trust-on-first-use as root.
          install -m 644 .github/ssh_known_hosts ~/.ssh/known_hosts_astraphe
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Pass credentials directly as flags instead of relying on environment variables
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          # ssh.astrapheai.com's Cloudflare Tunnel routes to the k3s cluster's
          # keepalived VIP (10.1.1.60:22), not a fixed host — it lands on
          # whichever of the 3 k3s nodes currently holds the VIP, so the
          # deploy key must be authorized as root on all 3.
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User root
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            UserKnownHostsFile ~/.ssh/known_hosts_astraphe
            BatchMode yes
          EOF

      # NOTE: custom email templates (supabase/templates/*.html) are not
      # deployed anywhere right now. The k3s `auth` (GoTrue) pod has no
      # mailer-template env vars or volume mounts configured, so it's been
      # sending its generic default emails since the migration regardless.
      # Wiring the real templates back in needs a ConfigMap + Deployment
      # change on the auth pod, not a file drop from CI — tracked separately.

      - name: Deploy to k3s
        # astraphe-api runs in the k3s cluster (namespace `astraphe`).
        # ssh.astrapheai.com lands on whichever k3s node currently holds the
        # VIP; kubectl there runs against a kubeconfig for a narrowly-scoped
        # ServiceAccount (`ci-deployer`, namespace `astraphe`) provisioned
        # ahead of time at /root/.kube/ci-deployer-config on all 3 nodes —
        # it can only patch the astraphe-api/astraphe-mcp Deployments' images
        # and read rollout status, nothing else (see deploy-mcp below for the
        # latter).
        run: |
          ssh root@ssh.astrapheai.com env IMAGE_TAG="${{ needs.build.outputs.image_tag }}" bash -s <<'ENDSSH'
            set -euo pipefail
            export KUBECONFIG=/root/.kube/ci-deployer-config
            kubectl set image deployment/astraphe-api -n astraphe \
              astraphe-api="ghcr.io/sbalbale/astraphe-api:${IMAGE_TAG}"
            kubectl rollout status deployment/astraphe-api -n astraphe --timeout=180s
            kubectl get pods -n astraphe -l app=astraphe-api
          ENDSSH

  deploy-mcp:
    needs: [build-mcp, mcp-server]
    # Separate job from `deploy` (astraphe-api) rather than an extra step in it: distinct
    # Deployment, distinct image, distinct set of required upstream jobs (astraphe-mcp
    # doesn't depend on `backend`'s or `mobile`'s tests passing, only its own). Previously
    # build-mcp published an image but nothing ever rolled it out — every deploy needed a
    # manual `kubectl rollout restart` after the fact (see docs/MCP_SERVER.md). Tagging by
    # commit SHA here (not just floating `:latest`) is what actually fixes that: a
    # `kubectl set image` to a new, distinct tag always triggers a real rollout, unlike
    # repointing at the same `:latest` tag which k8s sees as no spec change at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cloudflared
        run: |
          # Fixed version + checksum (not 'latest'): this binary carries the deploy credentials.
          CLOUDFLARED_VERSION=2026.10.7
          CLOUDFLARED_SHA256=1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o cloudflared
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          # Pinned host keys (see .github/ssh_known_hosts); never trust-on-first-use as root.
          install -m 644 .github/ssh_known_hosts ~/.ssh/known_hosts_astraphe
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User root
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            UserKnownHostsFile ~/.ssh/known_hosts_astraphe
            BatchMode yes
          EOF

      - name: Deploy to k3s
        run: |
          ssh root@ssh.astrapheai.com env IMAGE_TAG="${{ needs['build-mcp'].outputs.image_tag }}" bash -s <<'ENDSSH'
            set -euo pipefail
            export KUBECONFIG=/root/.kube/ci-deployer-config
            kubectl set image deployment/astraphe-mcp -n astraphe \
              astraphe-mcp="ghcr.io/sbalbale/astraphe-mcp:${IMAGE_TAG}"
            kubectl rollout status deployment/astraphe-mcp -n astraphe --timeout=180s
            kubectl get pods -n astraphe -l app=astraphe-mcp
          ENDSSH

  photon-bridge:
    # Node service that holds the Photon (iMessage) gRPC stream — see docs/PHOTON_MESSAGING.md.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: photon-bridge/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test
        working-directory: photon-bridge

  build-photon-bridge:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on merge to main)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: photon-bridge
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/sbalbale/astraphe-photon-bridge:latest
            ghcr.io/sbalbale/astraphe-photon-bridge:${{ github.sha }}

  deploy-photon-bridge:
    # PREREQUISITE (one-time, outside this repo): the `photon-bridge` Deployment must exist in
    # namespace `astraphe` and the ci-deployer role must be allowed to patch it — see
    # docs/PHOTON_MESSAGING.md ("Cluster bootstrap"). Until then this job fails at `kubectl set image`.
    needs: [build-photon-bridge, photon-bridge]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cloudflared
        run: |
          # Fixed version + checksum (not 'latest'): this binary carries the deploy credentials.
          CLOUDFLARED_VERSION=2026.10.7
          CLOUDFLARED_SHA256=1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o cloudflared
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          # Pinned host keys (see .github/ssh_known_hosts); never trust-on-first-use as root.
          install -m 644 .github/ssh_known_hosts ~/.ssh/known_hosts_astraphe
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User root
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            UserKnownHostsFile ~/.ssh/known_hosts_astraphe
            BatchMode yes
          EOF

      - name: Deploy to k3s
        run: |
          ssh root@ssh.astrapheai.com env IMAGE_TAG="${{ needs['build-photon-bridge'].outputs.image_tag }}" bash -s <<'ENDSSH'
            set -euo pipefail
            export KUBECONFIG=/root/.kube/ci-deployer-config
            kubectl set image deployment/photon-bridge -n astraphe \
              photon-bridge="ghcr.io/sbalbale/astraphe-photon-bridge:${IMAGE_TAG}"
            kubectl rollout status deployment/photon-bridge -n astraphe --timeout=180s
            kubectl get pods -n astraphe -l app=photon-bridge
          ENDSSH

  migrate:
    # Same upstream gates as `deploy`, but runs before it (see the note there).
    needs: [build, backend, mobile]
    # Never on pull_request — this applies migrations to production. Only a
    # real push to main (post-merge) migrates.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cloudflared
        run: |
          # Fixed version + checksum (not 'latest'): this binary carries the deploy credentials.
          CLOUDFLARED_VERSION=2026.10.7
          CLOUDFLARED_SHA256=1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o cloudflared
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          # Pinned host keys (see .github/ssh_known_hosts); never trust-on-first-use as root.
          install -m 644 .github/ssh_known_hosts ~/.ssh/known_hosts_astraphe
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Apply the same flag correction here
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          # ssh.astrapheai.com's Cloudflare Tunnel routes to the k3s cluster's
          # keepalived VIP (10.1.1.60:22), not a fixed host — it lands on
          # whichever of the 3 k3s nodes currently holds the VIP, so the
          # deploy key must be authorized as root on all 3.
          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User root
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking yes
            HostKeyAlgorithms ssh-ed25519
            UserKnownHostsFile ~/.ssh/known_hosts_astraphe
            BatchMode yes
          EOF

      - name: Sync migrations to a k3s node
        # The k3s nodes are fresh VMs with no persistent deploy checkout or
        # tooling (unlike the old ct100 host) — copy just what's needed for
        # this run instead of relying on a stateful git clone there. The CLI
        # expects to run from a project root containing a `supabase/`
        # subdirectory (supabase/config.toml, supabase/migrations/), not
        # those files directly in cwd, so preserve that layout. `supabase db
        # push` validates the whole config.toml before doing anything,
        # including auth.email.template.*.content_path — so the referenced
        # supabase/templates/*.html must be synced too, or config validation
        # fails before it ever gets to the migrations.
        #
        # One tar stream over a single ssh connection, retried: per-file scp through the tunnel
        # dropped mid-copy ("Broken pipe" / "Connection closed") and failed the deploy twice.
        run: |
          for attempt in 1 2 3; do
            if tar czf - supabase/migrations supabase/templates supabase/config.toml                 | ssh -o ServerAliveInterval=15 root@ssh.astrapheai.com                     'rm -rf /root/ci-migrate && mkdir -p /root/ci-migrate && tar xzf - -C /root/ci-migrate'; then
              exit 0
            fi
            echo "::warning::migration sync attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
          echo "::error::migration sync failed after 3 attempts"
          exit 1

      - name: Run new migrations
        # Postgres runs as supabase-db-0 in the k3s cluster (namespace
        # `supabase`) — reached via a kubectl port-forward through the same
        # ci-deployer kubeconfig as the deploy step (scoped to only
        # portforward into that one pod), then `supabase db push` against
        # the forwarded local port.
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Password is expanded here; the remote script is single-quoted via ssh bash -s.
          ssh root@ssh.astrapheai.com env SUPABASE_DB_PASSWORD="${SUPABASE_DB_PASSWORD}" bash -s <<'REMOTE'
            set -euo pipefail
            export KUBECONFIG=/root/.kube/ci-deployer-config

            # The supabase CLI ships as a `supabase` shim binary that forwards
            # to a co-located `supabase-go` binary — both must land in the
            # same directory, not just `supabase` copied out on its own.
            #
            # Pinned version + checksum, not releases/latest: v3.0.0 (2026-11-02)
            # rejects our config.toml's [inbucket] section and broke every deploy.
            # Installed into a per-version directory so a bump re-downloads.
            SUPABASE_CLI_VERSION=2.122.1
            SUPABASE_CLI_SHA256=3e54b98e5ead7be0a3b0753526833d4cc9a55304e4d57da0d72f1efc342738ea
            SUPABASE_CLI_DIR="${HOME}/.local/share/supabase-${SUPABASE_CLI_VERSION}"
            if [ ! -x "${SUPABASE_CLI_DIR}/supabase" ]; then
              echo "Installing supabase CLI ${SUPABASE_CLI_VERSION}"
              mkdir -p "${SUPABASE_CLI_DIR}"
              curl -fsSL -o /tmp/supabase-cli.tar.gz \
                "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_${SUPABASE_CLI_VERSION}_linux_amd64.tar.gz"
              echo "${SUPABASE_CLI_SHA256}  /tmp/supabase-cli.tar.gz" | sha256sum -c -
              tar -xzf /tmp/supabase-cli.tar.gz -C "${SUPABASE_CLI_DIR}"
              rm -f /tmp/supabase-cli.tar.gz
            fi
            export PATH="${SUPABASE_CLI_DIR}:${PATH}"
            supabase --version

            cd /root/ci-migrate

            kubectl port-forward -n supabase pod/supabase-db-0 15432:5432 >/tmp/pf.log 2>&1 &
            PF_PID=$!
            trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT

            for _ in $(seq 1 15); do
              if (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null; then
                exec 3<&- 3>&-
                break
              fi
              sleep 1
            done

            echo "Running supabase db push against k3s supabase-db-0 (via port-forward)"
            PGSSLMODE=disable supabase db push \
              --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@127.0.0.1:15432/postgres" \
              --yes
          REMOTE
