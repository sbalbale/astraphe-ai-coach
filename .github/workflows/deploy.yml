name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/sbalbale/astraphe-api:latest
            ghcr.io/sbalbale/astraphe-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Verify CF credentials are set
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID secret is not set or is empty"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET secret is not set or is empty"
            exit 1
          fi
          echo "CF credentials present (ID length: ${#CF_ACCESS_CLIENT_ID})"

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Pass credentials directly as flags instead of relying on environment variables
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Deploy email templates
        run: |
          ssh docker@ssh.astrapheai.com 'mkdir -p ~/astraphe/supabase/templates'
          scp supabase/templates/confirm.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/confirm.html
          scp supabase/templates/recovery.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/recovery.html

      - name: Deploy to Proxmox
        run: |
          ssh docker@ssh.astrapheai.com << 'ENDSSH'
            cd ~/astraphe
            docker compose pull astraphe-api
            docker compose up -d astraphe-api
            docker image prune -f
            docker compose ps
          ENDSSH

  migrate:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Apply the same flag correction here
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Run new migrations
        run: |
          ssh docker@ssh.astrapheai.com << ENDSSH
            export PATH="\$HOME/.local/share/supabase:\$PATH"
            cd ~/astraphe/repo
            git pull origin main
            # 172.21.0.3 is supabase-pooler (Supavisor), not Postgres — use supabase-db directly.
            DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' supabase-db)
            if [ -z "\$DB_IP" ]; then
              echo "::error::Could not resolve supabase-db container IP"
              exit 1
            fi
            PGSSLMODE=disable supabase db push \
              --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@\${DB_IP}:5432/postgres" \
              --yes
          ENDSSH