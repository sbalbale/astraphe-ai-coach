name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/sbalbale/astraphe-api:latest
            ghcr.io/sbalbale/astraphe-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Verify CF credentials are set
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID secret is not set or is empty"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET secret is not set or is empty"
            exit 1
          fi
          echo "CF credentials present (ID length: ${#CF_ACCESS_CLIENT_ID})"

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Pass credentials directly as flags instead of relying on environment variables
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Deploy email templates
        run: |
          ssh docker@ssh.astrapheai.com 'mkdir -p ~/astraphe/supabase/templates'
          scp supabase/templates/confirm.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/confirm.html
          scp supabase/templates/recovery.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/recovery.html

      - name: Deploy to Proxmox
        run: |
          ssh docker@ssh.astrapheai.com << 'ENDSSH'
            cd ~/astraphe
            docker compose pull astraphe-api
            docker compose up -d astraphe-api
            docker image prune -f
            docker compose ps
          ENDSSH

  migrate:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Apply the same flag correction here
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Run new migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Password is expanded here; the remote script is single-quoted via ssh bash -s.
          ssh docker@ssh.astrapheai.com env SUPABASE_DB_PASSWORD="${SUPABASE_DB_PASSWORD}" bash -s <<'REMOTE'
            set -euo pipefail
            export PATH="${HOME}/.local/share/supabase:${PATH}"
            REPO="${HOME}/astraphe/repo"
            SUPABASE_DOCKER="${HOME}/astraphe/supabase/docker"

            cd "${REPO}"
            git pull origin main

            # Resolve current supabase-db IP on supabase_default (changes when containers restart).
            # Never use supabase-pooler / host :5432 — that is Supavisor, not Postgres.
            resolve_db_ip() {
              if docker inspect supabase-db >/dev/null 2>&1; then
                docker inspect -f '{{index .NetworkSettings.Networks "supabase_default" "IPAddress"}}' supabase-db
                return 0
              fi
              if [ -f "${SUPABASE_DOCKER}/docker-compose.yml" ]; then
                local cid
                cid="$(cd "${SUPABASE_DOCKER}" && docker compose ps -q db 2>/dev/null | head -1)"
                if [ -n "${cid}" ]; then
                  docker inspect -f '{{index .NetworkSettings.Networks "supabase_default" "IPAddress"}}' "${cid}"
                  return 0
                fi
              fi
              return 1
            }

            db_push_host() {
              local host="$1"
              echo "Running supabase db push against ${host}:5432"
              PGSSLMODE=disable supabase db push \
                --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@${host}:5432/postgres" \
                --yes
            }

            # Fallback: run Supabase CLI on supabase_default and use compose DNS name "db".
            db_push_network() {
              echo "Running supabase db push via supabase_default (host=db)"
              docker run --rm \
                --network supabase_default \
                -v "${REPO}:/workspace" \
                -w /workspace \
                -e PGSSLMODE=disable \
                -e SUPABASE_DB_PASSWORD \
                public.ecr.aws/supabase/cli:latest \
                db push \
                --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@db:5432/postgres" \
                --yes
            }

            if DB_IP="$(resolve_db_ip)"; then
              db_push_host "${DB_IP}"
            elif docker network inspect supabase_default >/dev/null 2>&1; then
              db_push_network
            else
              echo "::error::Could not find supabase-db or supabase_default on this host."
              echo "Ensure ssh.astrapheai.com is the Docker host that runs ~/astraphe/supabase/docker."
              docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>/dev/null | head -25 || true
              exit 1
            fi
          REMOTE