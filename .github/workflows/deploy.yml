name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'supabase/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/sbalbale/astraphe-api:latest
            ghcr.io/sbalbale/astraphe-api:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/
          cloudflared --version

      - name: Verify CF credentials are set
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ]; then
            echo "::error::CF_ACCESS_CLIENT_ID secret is not set or is empty"
            exit 1
          fi
          if [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET secret is not set or is empty"
            exit 1
          fi
          echo "CF credentials present (ID length: ${#CF_ACCESS_CLIENT_ID})"

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Pass credentials directly as flags instead of relying on environment variables
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Deploy email templates
        run: |
          ssh docker@ssh.astrapheai.com 'mkdir -p ~/astraphe/supabase/templates'
          scp supabase/templates/confirm.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/confirm.html
          scp supabase/templates/recovery.html docker@ssh.astrapheai.com:~/astraphe/supabase/templates/recovery.html

      - name: Deploy to k3s
        # astraphe-api runs in the k3s cluster (namespace `astraphe`), not on
        # this Docker host anymore (migrated 2026-07-03). ssh.astrapheai.com
        # only reaches this LAN host, so we hop from here to the cluster's
        # API server (10.1.1.60:6443, the HA VIP) using a kubeconfig for a
        # narrowly-scoped ServiceAccount (`ci-deployer`, namespace `astraphe`)
        # that was provisioned ahead of time and lives at ~/astraphe/kubeconfig
        # on this host — it can only patch the astraphe-api Deployment's
        # image and read rollout status, nothing else.
        run: |
          ssh docker@ssh.astrapheai.com env IMAGE_TAG="${{ needs.build.outputs.image_tag }}" bash -s <<'ENDSSH'
            set -euo pipefail
            export KUBECONFIG="${HOME}/astraphe/kubeconfig"
            kubectl set image deployment/astraphe-api -n astraphe \
              astraphe-api="ghcr.io/sbalbale/astraphe-api:${IMAGE_TAG}"
            kubectl rollout status deployment/astraphe-api -n astraphe --timeout=180s
            kubectl get pods -n astraphe -l app=astraphe-api
          ENDSSH

  migrate:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH via Cloudflare Tunnel
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROXMOX_SSH_KEY }}" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy

          # Apply the same flag correction here
          printf '#!/bin/bash\nexec cloudflared access ssh --hostname "$1" --service-token-id "%s" --service-token-secret "%s"\n' \
            "$CF_ACCESS_CLIENT_ID" "$CF_ACCESS_CLIENT_SECRET" > /tmp/cf-proxy.sh
          chmod +x /tmp/cf-proxy.sh

          cat >> ~/.ssh/config << 'EOF'
          Host ssh.astrapheai.com
            HostName ssh.astrapheai.com
            User docker
            IdentityFile ~/.ssh/id_ed25519_deploy
            ProxyCommand /tmp/cf-proxy.sh %h
            StrictHostKeyChecking no
            BatchMode yes
          EOF

      - name: Run new migrations
        # Postgres runs as supabase-db-0 in the k3s cluster (namespace
        # `supabase`, migrated 2026-07-03) — not reachable directly from this
        # LAN host, so we port-forward to it through the k3s API server using
        # the same ci-deployer kubeconfig as the deploy step (scoped to only
        # portforward into that one pod) and run `supabase db push` against
        # the forwarded local port, same as before the migration.
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Password is expanded here; the remote script is single-quoted via ssh bash -s.
          ssh docker@ssh.astrapheai.com env SUPABASE_DB_PASSWORD="${SUPABASE_DB_PASSWORD}" bash -s <<'REMOTE'
            set -euo pipefail
            export PATH="${HOME}/.local/share/supabase:${PATH}"
            export KUBECONFIG="${HOME}/astraphe/kubeconfig"
            REPO="${HOME}/astraphe/repo"

            cd "${REPO}"
            git pull origin main

            kubectl port-forward -n supabase pod/supabase-db-0 15432:5432 >/tmp/pf.log 2>&1 &
            PF_PID=$!
            trap 'kill "${PF_PID}" 2>/dev/null || true' EXIT

            for _ in $(seq 1 15); do
              if (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null; then
                exec 3<&- 3>&-
                break
              fi
              sleep 1
            done

            echo "Running supabase db push against k3s supabase-db-0 (via port-forward)"
            PGSSLMODE=disable supabase db push \
              --db-url "postgresql://postgres:${SUPABASE_DB_PASSWORD}@127.0.0.1:15432/postgres" \
              --yes
          REMOTE