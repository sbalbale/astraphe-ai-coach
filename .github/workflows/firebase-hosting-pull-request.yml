# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install && pnpm build
        working-directory: mobile
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASTRAPHEAI }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting
      - id: deploy
        name: Deploy Firebase Hosting preview
        working-directory: mobile
        env:
          FIREBASE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_PROJECT: astrapheai
          FIREBASE_SITE: astrapheai
          FIREBASE_CHANNEL_ID: pr-${{ github.event.pull_request.number }}
          FIREBASE_CHANNEL_TTL: 604800s
        run: node scripts/deploy-firebase-hosting-rest.mjs
      - name: Comment Firebase Hosting preview URL
        if: ${{ steps.deploy.outputs.hosting_url != '' }}
        uses: actions/github-script@v7
        env:
          FIREBASE_HOSTING_URL: ${{ steps.deploy.outputs.hosting_url }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->';
            const body = `${marker}\nFirebase Hosting preview: ${process.env.FIREBASE_HOSTING_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
