name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests with coverage gate (80%)
        # app/config.py's Settings already default SUPABASE_URL/SUPABASE_KEY/
        # GEMINI_API_KEY to test placeholders, and the unit suite mocks every
        # external call — no secrets or env vars needed here.
        run: python -m pytest --cov=app --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No pinned version: track the runner's current default (matches
          # firebase-hosting-pull-request.yml's convention). Pinning to 20
          # broke this job outright once pnpm/action-setup's "latest" moved
          # to a pnpm release requiring Node >=22.13 (node:sqlite import).
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: mobile

      - name: Run mobile tests with coverage gate (80%/75% branches)
        run: pnpm test:coverage
        working-directory: mobile
