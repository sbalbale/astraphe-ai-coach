<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#08080F" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon-192.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/astrape-logo.png" />
		<meta name="apple-mobile-web-app-title" content="AstrapeAI" />
		<title>AstrapeAI</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Shown before JS loads; layout's onMount removes it once Svelte mounts -->
		<div id="pre-load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08080F;color:rgba(240,240,255,0.35);font-family:monospace;font-size:12px;letter-spacing:.12em">ASTRAPE</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
