<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0E0E10" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" href="%sveltekit.assets%/astraphe-logo.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-16x16.png" type="image/png" sizes="16x16" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" sizes="180x180" />
		<meta name="apple-mobile-web-app-title" content="AstrapheAI" />
		<title>AstrapheAI</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Shown before JS loads; layout's onMount removes it once Svelte mounts -->
		<div id="pre-load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0E0E10;color:#8A877F;font-family:monospace;font-size:12px;letter-spacing:.12em">ASTRAPHE</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
