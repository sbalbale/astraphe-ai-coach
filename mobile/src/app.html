<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#08080F" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128 192x192 256x256" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-192.png" type="image/png" sizes="192x192" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon-512.png" type="image/png" sizes="512x512" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/astraphe-logo.png" />
		<meta name="apple-mobile-web-app-title" content="AstrapheAI" />
		<title>AstrapheAI</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Shown before JS loads; layout's onMount removes it once Svelte mounts -->
		<div id="pre-load" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08080F;color:rgba(240,240,255,0.35);font-family:monospace;font-size:12px;letter-spacing:.12em">ASTRAPHE</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
