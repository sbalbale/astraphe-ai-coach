// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
</script>

// ─── CANVAS CHARTS ────────────────────────────────────────────────────────────
function LineChart({ data, color = '#4621FF', fill = true, height = 80, yKey, labels }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth, H = height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    const vals = yKey ? data.map(d => d[yKey]) : data;
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min || 1;
    const pad = { t: 4, b: labels ? 20 : 4, l: 4, r: 4 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const px = (i) => pad.l + (i / (vals.length - 1)) * plotW;
    const py = (v) => pad.t + plotH - ((v - min) / range) * plotH;
    if (fill) {
      const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + plotH);
      grad.addColorStop(0, color + '40');
      grad.addColorStop(1, color + '00');
      ctx.beginPath();
      vals.forEach((v, i) => i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)));
      ctx.lineTo(px(vals.length - 1), pad.t + plotH);
      ctx.lineTo(px(0), pad.t + plotH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();
    }
    ctx.beginPath();
    vals.forEach((v, i) => i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();
    if (labels) {
      ctx.font = '9px Space Grotesk, sans-serif';
      ctx.fillStyle = 'rgba(240,240,255,0.35)';
      ctx.textAlign = 'center';
      labels.forEach((l, i) => ctx.fillText(l, px(i), H - 4));
    }
  }, [data, color, fill, height, yKey, labels]);
  return <canvas ref={canvasRef} style={{ width: '100%', height }} />;
}

function MultiLineChart({ height = 100 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth, H = height;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, W, H);
    const days = trainingLoadData.length;
    const pad = { t: 8, b: 24, l: 36, r: 8 };
    const plotW = W - pad.l - pad.r, plotH = H - pad.t - pad.b;
    const allVals = trainingLoadData.flatMap(d => [d.atl, d.ctl]);
    const min = 0, max = Math.max(...allVals) + 10;
    const px = (i) => pad.l + (i / (days - 1)) * plotW;
    const py = (v) => pad.t + plotH - ((v - min) / (max - min)) * plotH;
    // Grid lines
    [0, 25, 50, 75, 100].forEach(v => {
      if (v > max) return;
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.moveTo(pad.l, py(v)); ctx.lineTo(pad.l + plotW, py(v));
      ctx.stroke();
      ctx.font = '9px Space Mono, monospace';
      ctx.fillStyle = 'rgba(240,240,255,0.3)';
      ctx.textAlign = 'right';
      ctx.fillText(v, pad.l - 4, py(v) + 3);
    });
    // ATL bars
    const bw = plotW / days * 0.5;
    trainingLoadData.forEach((d, i) => {
      const bh = (d.atl / max) * plotH;
      ctx.fillStyle = 'rgba(70,33,255,0.25)';
      ctx.fillRect(px(i) - bw / 2, py(d.atl), bw, bh);
    });
    // CTL line
    const drawLine = (key, color) => {
      ctx.beginPath();
      trainingLoadData.forEach((d, i) => i === 0 ? ctx.moveTo(px(i), py(d[key])) : ctx.lineTo(px(i), py(d[key])));
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
      trainingLoadData.forEach((d, i) => {
        ctx.beginPath();
        ctx.arc(px(i), py(d[key]), 3, 0, Math.PI * 2);
        ctx.fillStyle = color; ctx.fill();
      });
    };
    drawLine('ctl', '#00C8A8');
    // Day labels
    ctx.font = '9px Space Grotesk, sans-serif';
    ctx.fillStyle = 'rgba(240,240,255,0.35)';
    ctx.textAlign = 'center';
    trainingLoadData.forEach((d, i) => ctx.fillText(d.day, px(i), H - 6));
  }, [height]);
  return <canvas ref={canvasRef} style={{ width: '100%', height }} />;
}

function DonutChart({ data, size = 80 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    ctx.scale(dpr, dpr);
    const cx = size / 2, cy = size / 2, r = size / 2 - 6, iR = r * 0.62;
    let start = -Math.PI / 2;
    data.forEach(({ pct, color }) => {
      const angle = (pct / 100) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, start + angle);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      start += angle;
    });
    ctx.beginPath();
    ctx.arc(cx, cy, iR, 0, Math.PI * 2);
    ctx.fillStyle = '#0F0F1A';
    ctx.fill();
  }, [data, size]);
  return <canvas ref={canvasRef} style={{ width: size, height: size }} />;
}

const RadialProgress = ({ value, max = 100, size = 56, color = '#4621FF', label, sub }) => {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = size * dpr; canvas.height = size * dpr;
    ctx.scale(dpr, dpr);
    const cx = size / 2, cy = size / 2, r = size / 2 - 5;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 4; ctx.stroke();
    const angle = (value / max) * Math.PI * 2 - Math.PI / 2;
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, color); grad.addColorStop(1, color + 'AA');
    ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, angle);
    ctx.strokeStyle = grad; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
  }, [value, max, size, color]);
  return (
    <div style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
      <canvas ref={canvasRef} style={{ width: size, height: size }} />
      <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <span style={{ fontSize: size > 50 ? 14 : 11, fontWeight: 700, color: '#F0F0FF', lineHeight: 1 }}>{label || value}</span>
        {sub && <span style={{ fontSize: 8, color: 'var(--text2)', fontFamily: 'var(--mono)' }}>{sub}</span>}
      </div>
    </div>
  );
};

function ChatScreen() {
  const [messages, setMessages] = useState(initialMessages);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => {
    if (bottomRef.current) {
      bottomRef.current.parentElement.scrollTop = bottomRef.current.offsetTop;
    }
  }, [messages, loading]);

  const send = async () => {
    const text = input.trim();
    if (!text) return;
    setInput('');
    const userMsg = { id: Date.now(), role: 'user', text };
    setMessages(m => [...m, userMsg]);
    setLoading(true);
    try {
      const reply = await window.claude.complete({
        messages: [
          { role: 'user', content: `You are ASTRAPHE, an AI endurance sports coach. You have access to the athlete's data: CTL=68, ATL=38, TSB=+28, HRV=78ms (↑+6 this week), Sleep=7.5h avg, last workout was an easy 45min recovery run today with TSS=38. Be concise, data-driven, and motivating. Keep responses to 2-3 sentences. Athlete asks: ${text}` }
        ]
      });
      setMessages(m => [...m, { id: Date.now() + 1, role: 'ai', text: reply }]);
    } catch {
      setMessages(m => [...m, { id: Date.now() + 1, role: 'ai', text: aiResponses[Math.floor(Math.random() * aiResponses.length)] }]);
    }
    setLoading(false);
  };

  const suggestions = ['Plan this week', 'Am I overtrained?', 'Race day strategy', 'Improve VO2max'];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
      {/* Header */}
      <div style={{ padding: '0 0 12px', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{
            width: 40, height: 40, borderRadius: 12,
            background: 'linear-gradient(135deg, #4621FF, #00C8A8)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 18, flexShrink: 0
          }}>⚡</div>
          <div>
            <p style={{ fontWeight: 600, fontSize: 15 }}>ASTRAPHE Coach</p>
            <p style={{ fontSize: 11, color: 'var(--teal)' }}>● Online · analyzing your data</p>
          </div>
        </div>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12, paddingBottom: 8 }}>
        {messages.map(msg => (
          <div key={msg.id} style={{
            display: 'flex', flexDirection: 'column',
            alignItems: msg.role === 'user' ? 'flex-end' : 'flex-start',
          }}>
            {msg.role === 'ai' && (
              <div style={{
                width: 24, height: 24, borderRadius: 8, marginBottom: 4,
                background: 'linear-gradient(135deg, #4621FF, #00C8A8)',
                display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12
              }}>⚡</div>
            )}
            <div style={{
              maxWidth: '82%', padding: '10px 14px', borderRadius: msg.role === 'user' ? '18px 18px 4px 18px' : '4px 18px 18px 18px',
              background: msg.role === 'user' ? 'var(--blue)' : 'var(--glass2)',
              border: `1px solid ${msg.role === 'user' ? 'rgba(70,33,255,0.5)' : 'var(--border)'}`,
              fontSize: 13, lineHeight: 1.55, color: 'var(--text0)'
            }}>{msg.text}</div>
          </div>
        ))}
        {loading && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
            <div style={{ width: 24, height: 24, borderRadius: 8, marginBottom: 4, background: 'linear-gradient(135deg, #4621FF, #00C8A8)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12 }}>⚡</div>
            <div style={{ padding: '10px 16px', borderRadius: '4px 18px 18px 18px', background: 'var(--glass2)', border: '1px solid var(--border)', display: 'flex', gap: 4, alignItems: 'center' }}>
              {[0,1,2].map(i => (
                <div key={i} style={{
                  width: 6, height: 6, borderRadius: '50%', background: 'var(--blue)',
                  animation: `pulse 1.2s ease-in-out ${i * 0.2}s infinite`
                }} />
              ))}
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {/* Suggestions */}
      <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 8, flexShrink: 0 }}>
        {suggestions.map(s => (
          <button key={s} onClick={() => { setInput(s); setTimeout(() => inputRef.current?.focus(), 50); }} style={{
            whiteSpace: 'nowrap', padding: '5px 12px', borderRadius: 99, fontSize: 11,
            background: 'var(--glass)', border: '1px solid var(--border)', color: 'var(--text1)',
            cursor: 'pointer', fontFamily: 'var(--font)'
          }}>{s}</button>
        ))}
      </div>

      {/* Input */}
      <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
        <input
          ref={inputRef}
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && !loading && send()}
          placeholder="Ask your coach..."
          style={{
            flex: 1, padding: '11px 16px', borderRadius: 12, fontSize: 13,
            background: 'var(--glass2)', border: '1px solid var(--border)',
            color: 'var(--text0)', fontFamily: 'var(--font)', outline: 'none'
          }}
        />
        <button onClick={send} disabled={loading || !input.trim()} style={{
          width: 44, height: 44, borderRadius: 12, flexShrink: 0,
          background: input.trim() ? 'var(--blue)' : 'var(--glass)',
          border: `1px solid ${input.trim() ? 'var(--blue)' : 'var(--border)'}`,
          color: '#fff', cursor: 'pointer', fontSize: 18, display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'all 0.2s'
        }}>↑</button>
      </div>
    </div>
  );
}

// ─── RECOVERY SCREEN ──────────────────────────────────────────────────────────
function RecoveryScreen() {
  const score = 78;
  const history = [62, 71, 58, 80, 74, 69, 78];
  const days = ['M','T','W','T','F','S','S'];

  const factors = [
    { label: 'HRV', value: 78, unit: 'ms', score: 88, delta: '+6', color: '#00C8A8', desc: 'Above your 30-day baseline of 71ms. Strong parasympathetic response.' },
    { label: 'Resting HR', value: 52, unit: 'bpm', score: 82, delta: '-2', color: '#4621FF', desc: '2 bpm below baseline. Low resting HR indicates good cardiac efficiency.' },
    { label: 'Sleep Quality', value: 94, unit: '%', score: 91, delta: '+7', color: '#FFCB88', desc: '7.5h with 94% quality. Deep sleep at 22% — excellent for recovery.' },
    { label: 'Prior Load', value: 38, unit: 'TSS', score: 72, delta: '↓57', color: '#F07178', desc: 'Yesterday was a recovery day. Acute load dropped 57 pts from peak.' },
    { label: 'Body Temp', value: '+0.1', unit: '°F', score: 95, delta: '~', color: '#00C8A8', desc: 'Skin temp deviation minimal. No signs of illness or overheating.' },
    { label: 'SPO2', value: 98, unit: '%', score: 96, delta: '~', color: '#4621FF', desc: 'Blood oxygen within normal range all night.' },
  ];

  const ScoreGauge = ({ value }) => {
    const canvasRef = useRef(null);
    useEffect(() => {
      const canvas = canvasRef.current; if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const S = 140;
      canvas.width = S * dpr; canvas.height = S * dpr;
      ctx.scale(dpr, dpr);
      const cx = S / 2, cy = S / 2 + 10, r = 52;
      const startAngle = Math.PI * 0.75, endAngle = Math.PI * 2.25;
      // Track
      ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, endAngle);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
      // Value arc
      const valAngle = startAngle + (value / 100) * (endAngle - startAngle);
      const grad = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
      grad.addColorStop(0, '#F07178'); grad.addColorStop(0.4, '#FFCB88'); grad.addColorStop(0.7, '#00C8A8'); grad.addColorStop(1, '#4621FF');
      ctx.beginPath(); ctx.arc(cx, cy, r, startAngle, valAngle);
      ctx.strokeStyle = grad; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
      // Dot at end
      const ex = cx + Math.cos(valAngle) * r, ey = cy + Math.sin(valAngle) * r;
      ctx.beginPath(); ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill();
      // Labels
      ctx.font = `bold 32px Space Grotesk, sans-serif`; ctx.fillStyle = '#F0F0FF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(value, cx, cy - 4);
      ctx.font = `11px Space Mono, monospace`; ctx.fillStyle = 'rgba(240,240,255,0.4)';
      ctx.fillText('RECOVERY', cx, cy + 18);
      ctx.font = `10px Space Grotesk, sans-serif`; ctx.fillStyle = 'rgba(240,240,255,0.25)';
      ctx.textAlign = 'left'; ctx.fillText('0', cx - r - 4, cy + r * 0.38);
      ctx.textAlign = 'right'; ctx.fillText('100', cx + r + 4, cy + r * 0.38);
    }, [value]);
    return <canvas ref={canvasRef} style={{ width: 140, height: 140 }} />;
  };

  const color = score >= 75 ? '#00C8A8' : score >= 50 ? '#FFCB88' : '#F07178';
  const label = score >= 75 ? 'Recovered' : score >= 50 ? 'Moderate' : 'Fatigued';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      <div>
        <p style={{ fontSize: 12, color: 'var(--text2)', fontFamily: 'var(--mono)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Today · Apr 26</p>
        <h1 style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em' }}>Recovery</h1>
      </div>

      {/* Main gauge card */}
      <Card style={{ background: 'linear-gradient(135deg, rgba(0,200,168,0.12), rgba(70,33,255,0.08))', borderColor: 'rgba(0,200,168,0.25)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <ScoreGauge value={score} />
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
              <span style={{ fontSize: 20, fontWeight: 700, color }}>{label}</span>
            </div>
            <p style={{ fontSize: 12, color: 'var(--text1)', lineHeight: 1.6, marginBottom: 10 }}>Your body has absorbed last week's load. High HRV and quality sleep put you in the green.</p>
            <Tag color={color}>READY FOR QUALITY EFFORT</Tag>
          </div>
        </div>
      </Card>

      {/* 7-day history */}
      <Card>
        <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>7-Day Recovery Trend</p>
        <div style={{ display: 'flex', gap: 6, alignItems: 'flex-end', height: 60, marginBottom: 8 }}>
          {history.map((v, i) => {
            const c = v >= 75 ? '#00C8A8' : v >= 50 ? '#FFCB88' : '#F07178';
            const isToday = i === 6;
            return (
              <div key={i} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                <span style={{ fontSize: 9, color: c, fontFamily: 'var(--mono)' }}>{v}</span>
                <div style={{ width: '100%', borderRadius: '4px 4px 0 0', background: isToday ? c : c + '66', height: `${(v / 100) * 52}px`, transition: 'height 0.4s ease', boxShadow: isToday ? `0 0 8px ${c}` : 'none' }} />
              </div>
            );
          })}
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between' }}>
          {days.map((d, i) => <span key={i} style={{ flex: 1, textAlign: 'center', fontSize: 9, color: i === 6 ? 'var(--text0)' : 'var(--text2)', fontFamily: 'var(--mono)' }}>{d}</span>)}
        </div>
      </Card>

      {/* Contributing factors */}
      <Card>
        <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 12 }}>Contributing Factors</p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
          {factors.map((f, i) => (
            <div key={i} style={{ padding: '12px 0', borderBottom: i < factors.length - 1 ? '1px solid var(--border)' : 'none' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
                    <span style={{ fontSize: 12, fontWeight: 600 }}>{f.label}</span>
                    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                      <span style={{ fontSize: 11, color: f.delta.startsWith('+') ? '#00C8A8' : f.delta === '~' ? 'var(--text2)' : '#FFCB88', fontFamily: 'var(--mono)' }}>{f.delta}</span>
                      <span style={{ fontSize: 12, fontWeight: 700, fontFamily: 'var(--mono)', color: f.color }}>{f.value}<span style={{ fontSize: 9, fontWeight: 400, color: 'var(--text2)' }}>{f.unit}</span></span>
                    </div>
                  </div>
                  <div style={{ height: 4, background: 'var(--glass2)', borderRadius: 2, overflow: 'hidden', marginBottom: 5 }}>
                    <div style={{ width: `${f.score}%`, height: '100%', background: f.color, borderRadius: 2 }} />
                  </div>
                  <p style={{ fontSize: 10, color: 'var(--text2)', lineHeight: 1.5 }}>{f.desc}</p>
                </div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {/* ASTRAPHE insight */}
      <Card style={{ background: 'linear-gradient(135deg, rgba(70,33,255,0.12), transparent)', borderColor: 'rgba(70,33,255,0.25)' }}>
        <p style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>ASTRAPHE Recommendation</p>
        <p style={{ fontSize: 12, color: 'var(--text1)', lineHeight: 1.6 }}>Score of 78 with HRV peaking — this is your optimal window. Attack Tuesday's VO2max session with full confidence. Tomorrow: keep it to Z2 regardless of how good you feel.</p>
      </Card>
    </div>
  );
}

    training: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><polyline points="2,18 8,10 13,14 18,7 22,11" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    plan: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke={c} fill={active ? 'rgba(70,33,255,0.2)' : 'none'} strokeWidth="1.5"/><line x1="3" y1="9" x2="21" y2="9" stroke={c} strokeWidth="1.5"/><line x1="8" y1="2" x2="8" y2="6" stroke={c} strokeWidth="1.5" strokeLinecap="round"/><line x1="16" y1="2" x2="16" y2="6" stroke={c} strokeWidth="1.5" strokeLinecap="round"/><line x1="7" y1="14" x2="10" y2="14" stroke={c} strokeWidth="1.5" strokeLinecap="round"/><line x1="7" y1="18" x2="13" y2="18" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
    zones: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.5"/><circle cx="12" cy="12" r="5" stroke={c} strokeWidth="1.5" strokeDasharray="3 2"/><circle cx="12" cy="12" r="2" fill={active ? '#4621FF' : c}/></svg>,
    recovery: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke={c} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    sleep: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke={c} fill={active ? 'rgba(70,33,255,0.2)' : 'none'} strokeWidth="1.5"/></svg>,
    strain: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke={c} fill={active ? 'rgba(70,33,255,0.2)' : 'none'} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    chat: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke={c} fill={active ? 'rgba(70,33,255,0.2)' : 'none'} strokeWidth="1.5"/></svg>,
    connect: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke={c} strokeWidth="1.5"/><path d="M12 7v5l3 3" stroke={c} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    profile: <svg width="22" height="22" fill="none" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke={c} fill={active ? 'rgba(70,33,255,0.2)' : 'none'} strokeWidth="1.5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke={c} strokeWidth="1.5" strokeLinecap="round"/></svg>,
  };
  return icons[id] || null;
};

const ALL_NAV = [
  { id: 'dashboard', label: 'Home' },
  { id: 'training', label: 'Training' },
  { id: 'plan', label: 'Plan' },
  { id: 'zones', label: 'Zones' },
  { id: 'recovery', label: 'Recovery' },
  { id: 'sleep', label: 'Sleep' },
  { id: 'strain', label: 'Strain' },
  { id: 'chat', label: 'Coach' },
  { id: 'connect', label: 'Sync' },
  { id: 'profile', label: 'Profile' },
];

// ─── DESKTOP SIDEBAR ──────────────────────────────────────────────────────────
function Sidebar({ screen, setScreen }) {
  return (
    <div style={{
      width: 220, background: 'var(--bg1)', borderRight: '1px solid var(--border)',
      display: 'flex', flexDirection: 'column', padding: '24px 16px', gap: 4, flexShrink: 0
    }}>
      <div style={{ marginBottom: 24, paddingLeft: 8 }}>
        <p style={{ fontFamily: 'var(--mono)', fontWeight: 700, fontSize: 15, letterSpacing: '0.1em', color: '#4621FF' }}>ASTRAPHE</p>
        <p style={{ fontSize: 10, color: 'var(--text2)', fontFamily: 'var(--mono)', letterSpacing: '0.08em' }}>AI COACH · v2.1</p>
      </div>
      {[
        { group: 'Overview', items: ['dashboard','training','plan','zones'] },
        { group: 'Body', items: ['recovery','sleep','strain'] },
        { group: 'Tools', items: ['chat','connect','profile'] },
      ].map(({ group, items }) => (
        <div key={group} style={{ marginBottom: 8 }}>
          <p style={{ fontSize: 9, color: 'var(--text2)', fontFamily: 'var(--mono)', textTransform: 'uppercase', letterSpacing: '0.12em', padding: '6px 12px 4px' }}>{group}</p>
          {ALL_NAV.filter(n => items.includes(n.id)).map(item => (
            <button key={item.id} onClick={() => setScreen(item.id)} style={{
              display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', borderRadius: 10, width: '100%',
              background: screen === item.id ? 'var(--blue-dim)' : 'transparent',
              border: `1px solid ${screen === item.id ? 'rgba(70,33,255,0.25)' : 'transparent'}`,
              color: screen === item.id ? '#4621FF' : 'var(--text1)', cursor: 'pointer', fontFamily: 'var(--font)',
              fontSize: 13, fontWeight: screen === item.id ? 600 : 400, textAlign: 'left', transition: 'all 0.15s'
            }}>
              {NAV_ICON(item.id, screen === item.id)}
              {item.label}
            </button>
          ))}
        </div>
      ))}
      <div onClick={() => setScreen('profile')} style={{ marginTop: 'auto', padding: '12px', background: 'var(--glass)', borderRadius: 10, border: '1px solid var(--border)', cursor: 'pointer' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: '50%', background: 'linear-gradient(135deg, #4621FF, #00C8A8)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, flexShrink: 0 }}>M</div>
          <div>
            <p style={{ fontSize: 12, fontWeight: 600 }}>Marcus</p>
            <p style={{ fontSize: 10, color: 'var(--text2)' }}>CTL 68 · TSB +28</p>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('dashboard');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const isDesktop = window.innerWidth >= 768;
  const [, forceUpdate] = useState(0);

  useEffect(() => {
    const handler = () => forceUpdate(n => n + 1);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

  const wide = window.innerWidth >= 768;

  return (
    <div style={{ display: 'flex', height: '100%', overflow: 'hidden' }}>
      {wide && <Sidebar screen={screen} setScreen={setScreen} />}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: 'var(--bg0)' }}>
        {/* Mobile Header */}
        {!wide && (
          <div style={{ padding: '14px 16px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
            <p style={{ fontFamily: 'var(--mono)', fontWeight: 700, fontSize: 14, letterSpacing: '0.12em', color: '#4621FF' }}>ASTRAPHE</p>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--teal)', boxShadow: '0 0 6px var(--teal)' }} />
              <span style={{ fontSize: 10, color: 'var(--text2)', fontFamily: 'var(--mono)' }}>SYNCED</span>
            </div>
          </div>
        )}

        {/* Body sub-tabs — shown on mobile when in recovery/sleep/strain */}
        {!wide && ['recovery','sleep','strain'].includes(screen) && (
          <div style={{ display: 'flex', gap: 6, padding: '10px 16px 0', flexShrink: 0 }}>
            {[{id:'recovery',label:'Recovery'},{id:'sleep',label:'Sleep'},{id:'strain',label:'Strain'}].map(t => (
              <button key={t.id} onClick={() => setScreen(t.id)} style={{
                padding: '5px 14px', borderRadius: 99, fontSize: 12, fontWeight: 500,
                background: screen === t.id ? 'var(--blue)' : 'var(--glass)',
                color: screen === t.id ? '#fff' : 'var(--text1)',
                border: `1px solid ${screen === t.id ? 'var(--blue)' : 'var(--border)'}`,
                cursor: 'pointer', fontFamily: 'var(--font)', transition: 'all 0.2s'
              }}>{t.label}</button>
            ))}
          </div>
        )}

        {/* Screen Content */}
        <div style={{ flex: 1, overflowY: 'auto', padding: screen === 'chat' && !wide ? '12px 16px 16px' : wide ? '24px 28px' : '12px 16px', display: 'flex', flexDirection: 'column' }}>
          {screen === 'dashboard' && <DashboardScreen />}
          {screen === 'training' && <TrainingScreen />}
          {screen === 'plan' && <PlanScreen />}
          {screen === 'zones' && <ZonesScreen />}
          {screen === 'recovery' && <RecoveryScreen />}
          {screen === 'sleep' && <SleepScreen />}
          {screen === 'strain' && <StrainScreen />}
          {screen === 'chat' && <ChatScreen />}
          {screen === 'connect' && <ConnectScreen />}
          {screen === 'profile' && <ProfileScreen />}
        </div>

        {/* Mobile Nav — 5 primary items */}
        {!wide && (
          <div style={{
            display: 'flex', background: 'var(--bg1)', borderTop: '1px solid var(--border)',
            padding: '8px 0 max(8px, env(safe-area-inset-bottom))', flexShrink: 0
          }}>
            {NAV_ITEMS_MOBILE.map(item => (
              <button key={item.id} onClick={() => setScreen(item.id)} style={{
                flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
                background: 'none', border: 'none', cursor: 'pointer', padding: '4px 0',
                color: screen === item.id ? '#4621FF' : 'var(--text2)', transition: 'color 0.2s'
              }}>
                {NAV_ICON(item.id, screen === item.id)}
                <span style={{ fontSize: 9, fontFamily: 'var(--mono)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>{item.label}</span>
              </button>
            ))}
          </div>
        )}
      </div>

      <TweaksPanel>
        <TweakSection title="Appearance">
          <TweakColor label="Accent Blue" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
          <TweakColor label="Accent Teal" value={tweaks.tealColor} onChange={v => setTweak('tealColor', v)} />
        </TweakSection>
        <TweakSection title="Dashboard">
          <TweakToggle label="Show Readiness" value={tweaks.showReadiness} onChange={v => setTweak('showReadiness', v)} />
          <TweakRadio label="Units" value={tweaks.unitSystem} options={['metric', 'imperial']} onChange={v => setTweak('unitSystem', v)} />
        </TweakSection>
        <TweakSection title="Coach AI">
          <TweakSelect label="Personality" value={tweaks.coachPersonality} options={['analytical', 'motivational', 'gentle', 'tough love']} onChange={v => setTweak('coachPersonality', v)} />
        </TweakSection>
      </TweaksPanel>

      <style>{`
        @keyframes pulse {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40% { opacity: 1; transform: scale(1); }
        }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
